<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>そらいろ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
</head>
<body><div id="root"></div>
<noscript><p style="font:14px/1.7 sans-serif;padding:24px">そらいろを使うには、JavaScript を有効にしてください。</p></noscript>
<script>
// 4秒たっても画面が出ない場合（ファイルの読み込み失敗など）、白いままにせず理由を案内する。アプリが起動すると自動で置き換わる
setTimeout(function(){var r=document.getElementById('root');if(r&&!r.children.length){r.innerHTML='<div role="alert" style="font:14px/1.8 sans-serif;max-width:420px;margin:48px auto;padding:0 20px;color:#1f3350"><b style="font-size:16px">画面を読み込めませんでした</b><br>ページを再読み込みしてください。それでも表示されない場合は、管理者に連絡してください。<p style="font-size:12px;color:#6b7c8d;margin-top:20px">（管理者向け）GitHub Pages の「Settings → Pages → Source」が「GitHub Actions」になっているか、または、ビルド済みのファイル（index.html が assets フォルダを読み込む形）を公開しているかを確認してください。</p></div>'}},4000)
</script>
<script type="module" src="/src/main.tsx"></script></body>
</html>
